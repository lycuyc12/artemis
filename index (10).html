  if(iT>11.2&&iICPS.parent===iRoot){sfx("clank");iScene.attach(iICPS);iStackV.copy(iCD).multiplyScalar(-1.2);iICPS.userData.v=iStackV.clone()}
  if(iICPS.parent===iScene){iICPS.position.addScaledVector(iICPS.userData.v,dt);iICPS.rotation.x+=dt*.5;if(iT>15)iICPS.visible=false}
  if(iT>7)iPanels.forEach(q=>q.scale.x=Math.min(1,q.scale.x+dt*.7));
  const fk=.85+.3*Math.sin(iT*40);fl1.visible=!iSep;fl1.scale.set(fk,fk*1.1,fk);
  fl2.visible=iT>6&&iT<11&&iICPS.parent===iRoot;fl2.scale.set(fk,fk,fk);fl3.visible=iT>19.5&&iT<22.4;fl3.scale.set(fk,fk,fk);
  if(iT<6){iCamT.set(p.x+24,p.y-8,34);iLT.copy(p);iLT.y+=3}
  else if(iT<19){const u=(iT-6)/13;iCamT.copy(p).addScaledVector(iCD,-16);iCamT.y+=5;iCamT.z+=12;iLT.copy(p).addScaledVector(iCD,12).lerp(IM,sm((u-.3)/.7))}
  else{iCamT.set(p.x+16,p.y+8,p.z+24);iLT.copy(p).lerp(iLander.position,iT>22.4?.65:0)}
  if(iFirst){camI.position.copy(iCamT);iLook.copy(iLT);iFirst=false}
  const k=1-Math.exp(-2.5*dt);camI.position.lerp(iCamT,k);iLook.lerp(iLT,k);camI.lookAt(iLook);iStars.position.copy(camI.position);
  iEmbOp();
  if(iT>22.2){iLander.visible=true;const u=Math.min(1,(iT-22.4)/4.6),e=u*u*(3-2*u),st=new THREE.Vector3(p.x+2.5,p.y-2,p.z+1),en=new THREE.Vector3(iSite.position.x,iSite.position.y,iSite.position.z+3.2);iLander.position.lerpVectors(st,en,e);iLander.rotation.x=PI/2*(1-e*.0);fl4.visible=u<1;fl4.scale.set(fk,fk,fk)}
  iSite.visible=iT>20;if(iSite.visible){const s=1+.12*Math.sin(iT*5);iSite.scale.set(s,s,s)}
  const dE=Math.max(0,(p.length()-60)*600),dM=Math.max(0,(p.distanceTo(IM)-16)*600),ru=lang==="ru",nf=n=>Math.round(n).toLocaleString(ru?"ru-RU":"en-US"),sec=Math.floor(iT);
  $("ihud").innerHTML="T+ "+String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")+"<br>"+(ru?"ОТ ЗЕМЛИ: ":"FROM EARTH: ")+nf(dE)+(ru?" км":" km")+"<br>"+(ru?"ДО ЛУНЫ: ":"TO MOON: ")+nf(dM)+(ru?" км":" km")+(aOn()?"":"<br>🔊 "+(ru?"Нажми, чтобы включить звук":"Click to enable sound"));
  let ci=0;for(let i=0;i<CAPS.length;i++)if(iT>=CAPS[i][0])ci=i;
  const c=CAPS[ci],o=lang==="ru"?1:3,nx=ci<CAPS.length-1?CAPS[ci+1][0]:IEND-1;
  $("cap1").textContent=c[o];$("cap2").textContent=c[o+1];$("cap").style.opacity=Math.max(0,Math.min(1,(iT-c[0])*2,(nx-iT)*2));
  $("fade").style.opacity=iT<1.2?1-iT/1.2:iT>IEND-1?Math.min(1,iT-(IEND-1)):0;
  if(iT>=IEND)endIntro();
}
$("skip").addEventListener("click",e=>{e.stopPropagation();endIntro()});
$("stage").addEventListener("click",()=>{if(state==="intro"){if(wasOff){wasOff=false;return}endIntro()}});

// ---- overlay / flow ----
function showOv(extra){
  const M2={start:["sT","sD","sH"],next:["nT","nD","nH"],lost:["lT","lD","lH"],won:["wT","wD","wH"],bossWon:["bwT","bwD","bwH"],bossLost:["blT","blD","blH"]}[state],ov=$("ov");
  if(!M2){ov.style.display="none";return}
  ov.style.display="flex";$("ot").textContent=tr(M2[0],state==="next"?lvl:undefined);$("od").textContent=tr(M2[1],state==="won"?total:state==="next"?(extra!==undefined?extra:up.drill*2):undefined);$("oh").textContent=tr(M2[2]);
  $("ot").style.color=/lost|Lost/.test(state)?"#f87171":state==="start"?"#60a5fa":"#4ade80";
}
function renderBase(){
  const el=$("base"),maxed=sumUp()>=18,btn={new:"bNew",next:"bNext",retry:"bRetry",boss:"bBoss"}[act],tier=Math.min(3,Math.floor(sumUp()/6));
  el.innerHTML='<div class="bank">'+tr("bankL")+' <b>'+bank+'</b> &nbsp;|&nbsp; '+tr("bL",sumUp())+' — <b>'+T[lang].tiers[tier]+'</b>'+(act==="boss"?' &nbsp;|&nbsp; <b style="color:#f87171">⚠ '+tr("bossN")+'</b>':'')+'</div><div class="cards">'+KEYS.map((k,i)=>{
    const L=up[k],max=L>=3,c=COST[L];
    return '<div class="card"><b>'+T[lang].blds[i][0]+'</b><span>'+"●".repeat(L)+"○".repeat(3-L)+'</span><small>'+T[lang].blds[i][1]+'</small><button data-u="'+i+'"'+(max||bank<c?' disabled':'')+'>'+(max?tr("maxS"):tr("upS",c))+'</button></div>'}).join("")
    +'</div><button id="go"'+(act==="boss"?' style="background:#b91c1c;border-color:#f87171"':'')+'>'+tr(btn)+'</button>';
  el.classList.add("on");hudTotal();
}
function openBase(a){act=a;state="base";$("ov").style.display="none";$("bossbar").style.display="none";$("cmp").style.display="none";$("combo").style.display="none";camA=.5;buildHub();KEYS.forEach((k,i)=>placeB(i,false));renderBase();setBlab()}
function launch(a){
  $("base").classList.remove("on");
  if(a==="boss")startBoss();else{if(act==="next")lvl++;if(act==="new"){lvl=1;total=0}state="play";setup()}
  $("ov").style.display="none";setBlab();R.domElement.focus&&R.domElement.focus();
}
function advance(){if(state==="intro"){endIntro();return}const m={start:"new",next:"next",lost:"retry",won:"boss",bossWon:"new",bossLost:"boss"}[state];if(m)openBase(m)}
function applyLang(){
  document.documentElement.lang=lang;document.title=tr("h1");
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=tr(e.dataset.i));
  $("lang").textContent=lang==="ru"?"EN":"RU";setBlab();if(state==="base")renderBase();else showOv();if(boss)$("bn").textContent=tr("bossN");
}
addEventListener("keydown",e=>{
  if(e.target&&e.target.tagName==="INPUT")return;
  if(state!=="base"&&["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
  if(state!=="base"&&(e.code==="Space"||e.code==="Enter")&&!e.repeat)advance();
  if(e.code==="KeyR"&&state==="play")setup();
  keys[e.code]=true});
addEventListener("keyup",e=>{keys[e.code]=false});addEventListener("blur",()=>{for(const k in keys)keys[k]=false});
$("ov").addEventListener("click",advance);
function sndUi(){$("snd").textContent=muted?"🔇":"🔊"}sndUi();
$("snd").addEventListener("click",()=>{muted=!muted;try{localStorage.setItem("lunarMute",muted?"1":"0")}catch(e){}if(master)master.gain.value=muted?0:.55;sndUi()});
$("lang").addEventListener("click",()=>{lang=lang==="ru"?"en":"ru";try{localStorage.setItem("lunarLang",lang)}catch(e){}applyLang()});
document.querySelectorAll(".pad button").forEach(b=>{const k=b.dataset.k;b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true});["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=false}))});
$("base").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.id==="go"){launch(act);return}if(b.id==="boss"){launch("boss");return}
  const i=+b.dataset.u,k=KEYS[i],L=up[k];
  if(L<3&&bank>=COST[L]){bank-=COST[L];up[k]++;save();placeB(i,true);sfx("build");buildHub();camT=slotA(i);camHold=3.2;renderBase()}
});

// ---- admin mode ----
const ADMIN_PW="artemis",adm=$("admin");
function admOpen(auth){
  const ru=lang==="ru",bt=(a,t,c)=>'<button data-a="'+a+'"'+(c?' style="background:'+c+'"':'')+'>'+t+'</button>';
  adm.innerHTML='<div class="box">'+(auth?
    '<h3 style="margin:0 0 12px;color:#facc15">'+(ru?"Админ-режим":"Admin mode")+'</h3><div style="display:grid;gap:8px">'+bt("i50",ru?"+50 льда":"+50 ice")+bt("i500",ru?"+500 льда":"+500 ice")+bt("max",ru?"Достроить всю базу":"Max out the base")+bt("ult",ru?"Зарядить ульту":"Charge ultimate")+bt("boss",ru?"⚔ Сразу к боссу":"⚔ Go to boss","#b91c1c")+bt("reset",ru?"Сбросить прогресс":"Reset progress","#475569")+bt("x",ru?"Закрыть":"Close","#334155")+'</div>'
    :'<h3 style="margin:0 0 10px">'+(ru?"Пароль":"Password")+'</h3><input id="apw" type="password" autocomplete="off"><div id="aerr"></div><div style="display:flex;gap:8px;justify-content:center">'+bt("ok","OK")+bt("x",ru?"Отмена":"Cancel","#334155")+'</div>')+'</div>';
  adm.style.display="flex";for(const k in keys)keys[k]=false;const i=$("apw");if(i)i.focus();
}
function admCheck(){if($("apw").value===ADMIN_PW)admOpen(true);else{$("aerr").textContent=lang==="ru"?"Неверный пароль":"Wrong password"}}
adm.addEventListener("click",e=>{
  if(e.target===adm){adm.style.display="none";return}
  const b=e.target.closest("button");if(!b)return;const a=b.dataset.a;
  if(a==="x"){adm.style.display="none";return}
  if(a==="ok"){admCheck();return}
  if(a==="i50"||a==="i500"){const n=a==="i50"?50:500;bank+=n;save();hudTotal();if(state==="base")renderBase();toast("+"+n+" ❄","#7dd3fc")}
  if(a==="max"){KEYS.forEach(k=>up[k]=3);save();if(state==="base"){buildHub();KEYS.forEach((k,i)=>placeB(i,true));renderBase()}toast("MAX","#facc15")}
  if(a==="ult"){ult=100}
  if(a==="reset"){KEYS.forEach(k=>up[k]=0);bank=0;save();hudTotal();if(state==="base"){buildHub();KEYS.forEach((k,i)=>placeB(i,false));renderBase()}}
  if(a==="boss"){adm.style.display="none";act="boss";launch("boss")}
});
adm.addEventListener("keydown",e=>{if(e.key==="Enter"&&$("apw"))admCheck();if(e.key==="Escape")adm.style.display="none"});
$("adm").addEventListener("click",()=>admOpen(false));
resize();setup();state="intro";startIntro();applyLang();
let last=performance.now();
(function loop(ts){
  const dt=Math.min(.05,((ts||last)-last)/1000)||.016;last=ts||last;
  update(dt);if(state==="intro")paint(iScene,camI);else if(state!=="base")renderWorld(dt);
  requestAnimationFrame(loop)
})(last);
})();
</script>
